# Rebuilds the site whenever one of its sources changes (Oct 2026).
#
# The nine pages, css/site.min.css and js/*.min.js are generated by build.sh from build-pages.py,
# css/site.css and js/*.js, and Cloudflare publishes this repo exactly as it is, with no build of its
# own. So an edit to a source (by WebEaze's request bot, or anyone) never reached the live site until
# someone ran ./build.sh by hand. This runs it on push and commits the result, and Cloudflare then
# publishes that commit like any other.
name: Build pages
on:
  push:
    branches: [main]
    paths: ['build-pages.py', 'build.sh', 'css/site.css', 'js/main.js', 'js/contact.js', '.github/workflows/build.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build
        run: bash build.sh
      - name: Commit the rebuilt pages
        run: |
          if git diff --quiet; then echo "Already up to date."; exit 0; fi
          git config user.name "WebEaze build"
          git config user.email "builds@webeaze.io"
          git add -A
          git commit -m "Rebuild pages from source"
          git push
